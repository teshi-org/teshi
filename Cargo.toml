[profile.release]
lto = true
strip = "symbols"

[workspace]
resolver = "3"
members = [
    "apps/teshi-cli",
    "crates/teshi-tui",
    "crates/teshi-core",
    "crates/teshi-agent",
    "crates/teshi-engine",
    "apps/teshi-daemon",
    "apps/teshi-terminal-sidecar",
    "apps/teshi-tauri",
    "apps/teshi-desktop",
]
exclude = ["runner"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
teshi-agent = { path = "crates/teshi-agent" }
teshi-core = { path = "crates/teshi-core" }
teshi-engine = { path = "crates/teshi-engine" }
teshi-tui = { path = "crates/teshi-tui" }
