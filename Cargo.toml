[package]
name = "teshi"
version = "0.7.6"
edition = "2024"
authors = ["teshi-org"]
license = "MIT"
description = "Terminal-first mindmap editor for structured notes and navigation."
repository = "https://github.com/teshi-org/teshi"
readme = "README.md"
keywords = ["tui", "mindmap", "editor", "terminal", "notes"]
publish = false

[profile.release]
lto = true
strip = "symbols"

[package.metadata.wix]
eula = false

[workspace]
members = [
    ".",
    "crates/teshi-gherkin",
    "crates/teshi-runtime",
    "crates/teshi-daemon",
    "desktop/src-tauri",
]
exclude = ["runner"]

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "=0.28.1"
dirs = "6"
inquire = "0.7"
ratatui = "0.29"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
teshi-gherkin = { path = "crates/teshi-gherkin" }
teshi-runtime = { path = "crates/teshi-runtime" }
teshi-daemon = { path = "crates/teshi-daemon" }
toml = "0.8"
tui-tree-widget = "0.23"
unicode-width = "0.2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json", "blocking"] }
tokio = { version = "1", features = ["rt", "macros", "time", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winres = "0.1"
