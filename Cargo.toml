[profile.release]
lto = true
strip = "symbols"

[workspace]
resolver = "3"
members = [
    "apps/teshi-cli",
    "crates/teshi-tui",
    "crates/teshi-core",
    "crates/teshi-agent",
    "crates/teshi-engine",
    "crates/teshi-ui",
    "apps/teshi-daemon",
    "apps/teshi-terminal-sidecar",
    "apps/teshi-tauri",
    "apps/teshi-desktop",
    "apps/teshi-web",
]
exclude = ["runner"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
# Pinned Zed revision with GPUI web (`single_threaded_web`) and FetchHttpClient.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
teshi-agent = { path = "crates/teshi-agent" }
teshi-core = { path = "crates/teshi-core" }
teshi-engine = { path = "crates/teshi-engine" }
teshi-tui = { path = "crates/teshi-tui" }
teshi-ui = { path = "crates/teshi-ui" }
