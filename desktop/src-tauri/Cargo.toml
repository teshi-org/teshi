[package]
name = "teshi-desktop"
version = "0.7.1"
description = "teshi desktop recorder and runner shell"
authors = ["teshi-org"]
edition = "2021"
publish = false

[lib]
name = "teshi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dunce = "1"
dirs = "6"
notify = "7.0"
tungstenite = "0.24"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
teshi-gherkin = { path = "../../crates/teshi-gherkin" }
teshi-runtime = { path = "../../crates/teshi-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
