[package]
name = "teshi-tui"
version.workspace = true
edition = "2024"
authors = ["teshi-org"]
license = "MIT"
description = "Terminal-first mindmap editor for structured notes and navigation."
repository = "https://github.com/teshi-org/teshi"
publish = false

[dependencies]
teshi-acp.workspace = true
teshi-update.workspace = true
anyhow.workspace = true
arboard = "3"
base64.workspace = true
clap.workspace = true
crossterm = "=0.28.1"
dirs = "6"
futures = "0.3"
inquire = "0.7"
ratatui = "0.29"
reqwest.workspace = true
ropey = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
teshi-agent.workspace = true
teshi-agent-runtime.workspace = true
teshi-core.workspace = true
teshi-engine.workspace = true
tracing.workspace = true
tokio.workspace = true
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
tui-tree-widget = "0.23"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
termwiz = "0.23.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
teshi-agent-runtime = { workspace = true, features = ["test-fixtures"] }
