[package]
name = "teshi-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local HTTP/WebSocket host for teshi desktop UI in the browser"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teshi-gherkin = { path = "../teshi-gherkin" }
teshi-runtime = { path = "../teshi-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = "1"
