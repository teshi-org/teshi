[package]
name = "teshi-terminal-sidecar"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone terminal sidecar with VTE screen grid for CLI automation"

[dependencies]
anyhow = "1"
futures-util = "0.3"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teshi-runtime = { path = "../teshi-runtime" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
vte = "0.15"
