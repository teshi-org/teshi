[package]
name = "teshi-tui-runner"
version = "0.1.0"
edition = "2024"
publish = false

# Real terminal acceptance repeatedly paints and encodes large evidence frames.
# Optimize only this isolated runner's image dependencies; keep its test code
# debuggable and leave the product workspace's development profile unchanged.
[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[workspace]

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teshi-core = { path = "../teshi-core" }
teshi-replay-evidence = { path = "../teshi-replay-evidence" }
resvg = "0.46"
tempfile = "3"
tui-test-rs = "=0.1.0"
unicode-width = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
