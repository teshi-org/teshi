[package]
name = "teshi-update"
version.workspace = true
edition = "2024"
publish = false
license = "MIT"
description = "Native release discovery and recoverable application updates for Teshi"

[dependencies]
teshi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
chrono.workspace = true
sha2 = "0.10"
semver = "1"
thiserror = "2"
tempfile = "3"
fs2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
rustls-native-certs = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
