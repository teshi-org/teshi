[package]
name = "teshi-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared BDD desktop runtime (project, terminal, browser sidecar, locator)"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
dirs = "6"
fd-lock = "4"
notify = "7.0"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teshi-gherkin = { path = "../teshi-gherkin" }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
vte = "0.15"
tungstenite = "0.24"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
