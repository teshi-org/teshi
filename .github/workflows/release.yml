name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string
      run_scope:
        description: "Workflow scope: full release or windows-only retry"
        required: true
        default: full
        type: choice
        options:
          - full
          - windows-only

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RESOLVED_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESOLVED_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build teshi CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin teshi

      # Windows-only: build teshi-desktop + combined MSI installer
      - name: Setup Node.js
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend (desktop/dist)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Build teshi-desktop binary
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --release --locked -p teshi-desktop

      - name: Install WiX Toolset
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Cache cargo-wix
        id: cache_cargo_wix
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: ${{ runner.os }}-cargo-wix-0.3.9

      - name: Install cargo-wix
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.cache_cargo_wix.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --locked --version 0.3.9

      - name: Build combined MSI installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.release_tag }}"
          }
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with 'v' (got: $tag)." }

          $stagingRoot = "staging/msi-root"
          $binDir    = Join-Path $stagingRoot "bin"
          $shareDir  = Join-Path $stagingRoot "share"
          $webDir    = Join-Path $stagingRoot "share/web"
          $bridgeDir = Join-Path $stagingRoot "share/teshi-bridge"
          New-Item -ItemType Directory -Force -Path $binDir, $webDir, $bridgeDir | Out-Null

          # Verify required files
          $builtExe    = "target/${{ matrix.target }}/release/teshi.exe"
          $desktopExe  = "target/release/teshi-desktop.exe"
          @($builtExe, $desktopExe, "desktop/dist", "desktop/src-tauri/resources/browser_service.py",
            "desktop/src-tauri/resources/winapp_service.py", "extension/teshi-bridge/manifest.json") |
            ForEach-Object { if (-not (Test-Path $_)) { throw "Missing: $_" } }

          Copy-Item $builtExe   (Join-Path $binDir "teshi.exe")          -Force
          Copy-Item $desktopExe (Join-Path $binDir "teshi-desktop.exe")  -Force
          Copy-Item "desktop/src-tauri/resources/browser_service.py" (Join-Path $shareDir "browser_service.py") -Force
          Copy-Item "desktop/src-tauri/resources/winapp_service.py"  (Join-Path $shareDir "winapp_service.py") -Force
          Copy-Item -Path "desktop/dist/*"       -Destination $webDir    -Recurse -Force
          Copy-Item -Path "extension/teshi-bridge/*" -Destination $bridgeDir -Recurse -Force

          # Generate WiX fragments for web and bridge files
          $heat = Join-Path $env:WIX "bin/heat.exe"
          & $heat dir $webDir    -out wix/web-files.wxs    -gg -sfrag -srd -dr ShareWebDir    -cg WebFiles    -var var.WebRoot
          & $heat dir $bridgeDir -out wix/bridge-files.wxs -gg -sfrag -srd -dr ShareTeshiBridgeDir -cg BridgeFiles -var var.BridgeRoot

          # Add fallback defines to heat-generated files
          $defaultBlock = @"
`n<?ifndef WebRoot ?><?define WebRoot = "$([System.IO.Path]::GetFullPath($webDir))"?><?endif ?>
<?ifndef BridgeRoot ?><?define BridgeRoot = "$([System.IO.Path]::GetFullPath($bridgeDir))"?><?endif ?>
"@
          foreach ($f in @("wix/web-files.wxs", "wix/bridge-files.wxs")) {
            $content = Get-Content $f -Raw
            $idx = $content.IndexOf("`n")
            if ($idx -ge 0) {
              Set-Content $f -Value ($content.Substring(0, $idx) + $defaultBlock + $content.Substring($idx)) -NoNewline
            }
          }

          cargo wix --package teshi --nocapture --no-build -o "target/wix/teshi-$tag-x64.msi"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: teshi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/teshi
            target/${{ matrix.target }}/release/teshi.exe
          if-no-files-found: error

      - name: Upload MSI artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: teshi-msi
          path: target/wix/teshi-*-x64.msi
          if-no-files-found: error

      - name: Upload web dist artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: teshi-web-dist
          path: desktop/dist
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_scope != 'windows-only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESOLVED_REF }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          if [[ ! "${tag}" =~ ^v.+$ ]]; then echo "Tag must start with 'v' (got: ${tag})." >&2; exit 1; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$(git rev-list -n 1 "${tag}")" >> "$GITHUB_OUTPUT"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_meta.outputs.tag }}"
          mkdir -p dist

          artifacts_dir="${{ github.workspace }}/artifacts"
          repo_dir="${{ github.workspace }}"

          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            binary_name="teshi"
            [[ "${target}" == *"windows"* ]] && binary_name="teshi.exe"

            stage_dir="dist/teshi-${version}-${target}"
            mkdir -p "${stage_dir}"
            cp "${artifacts_dir}/teshi-${target}/${binary_name}" "${stage_dir}/"

            if [[ "${target}" == *"windows"* ]]; then
              # Service scripts and browser extension from git checkout
              mkdir -p "${stage_dir}/share/teshi-bridge" "${stage_dir}/share/web"
              cp "${repo_dir}/desktop/src-tauri/resources/browser_service.py" "${stage_dir}/share/browser_service.py"
              cp "${repo_dir}/desktop/src-tauri/resources/winapp_service.py"  "${stage_dir}/share/winapp_service.py"
              cp -r "${repo_dir}/extension/teshi-bridge/."  "${stage_dir}/share/teshi-bridge/"
              cp -r "${artifacts_dir}/teshi-web-dist/."      "${stage_dir}/share/web/"
            else
              chmod +x "${stage_dir}/teshi"
            fi

            if [[ "${target}" == *"windows"* ]]; then
              (cd dist && zip -r "teshi-${version}-${target}.zip" "teshi-${version}-${target}")
            else
              tar -C dist -czf "dist/teshi-${version}-${target}.tar.gz" "teshi-${version}-${target}"
            fi
          done

          (cd "${repo_dir}/extension/teshi-bridge" && zip -r "${repo_dir}/dist/teshi-bridge-${version}.zip" .)

          cp "${artifacts_dir}/teshi-msi/"*.msi dist/
          cd dist
          find . -maxdepth 1 \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.msi" \) \
            -exec sha256sum {} + | sed 's|\./||' > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/SHA256SUMS

  submit_winget:
    name: Submit WinGet manifest
    runs-on: windows-latest
    needs: publish
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_scope != 'windows-only' }}

    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: winget install --id Microsoft.WingetCreate -e --source winget --accept-package-agreements --accept-source-agreements

      - name: Submit MSI to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Host "Skipping WinGet submission: WINGET_TOKEN not configured."
            exit 0
          }

          $tag = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $msiUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/teshi-$tag-x64.msi"
          $prTitle = "Add teshi $version"
          $pkgId = "teshi-org.teshi"
          $manifestDir = ".\winget-manifests\manifests\t\teshi-org\teshi\$version"

          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          $msiPath = Join-Path $manifestDir "teshi-$tag-x64.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
          $sha256 = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash
          Remove-Item -Path $msiPath -Force

          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ | Set-Content -NoNewline (Join-Path $manifestDir "$pkgId.yaml")

          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          Installers:
            - Architecture: x64
              InstallerType: wix
              InstallerUrl: $msiUrl
              InstallerSha256: $sha256
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ | Set-Content -NoNewline (Join-Path $manifestDir "$pkgId.installer.yaml")

          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: teshi-org
          PackageName: teshi
          License: MIT
          ShortDescription: Terminal-first mindmap editor for structured notes and navigation.
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ | Set-Content -NoNewline (Join-Path $manifestDir "$pkgId.locale.en-US.yaml")

          wingetcreate submit --prtitle $prTitle --token $env:WINGET_TOKEN --no-open $manifestDir
