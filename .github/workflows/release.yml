name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string
      run_scope:
        description: "Workflow scope: full release or windows-only retry"
        required: true
        default: full
        type: choice
        options:
          - full
          - windows-only
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.7.9-nightly.20260801.abc1234)"
        required: true
        type: string
      source_ref:
        description: "Git ref to build (branch, tag, or SHA). Defaults to release_tag."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: false
      skip_winget:
        description: "Skip WinGet manifest submission"
        required: false
        type: boolean
        default: false
      run_scope:
        description: "Workflow scope: full release or windows-only retry"
        required: false
        type: string
        default: full
      invoked_via_call:
        description: "True when this workflow runs as a reusable workflow caller"
        required: false
        type: boolean
        default: false
      release_body:
        description: "Optional GitHub release description (overrides auto-generated notes when set)"
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ inputs.release_tag || github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      skip_winget: ${{ steps.meta.outputs.skip_winget }}
      run_scope: ${{ steps.meta.outputs.run_scope }}
      release_body: ${{ steps.meta.outputs.release_body }}
    steps:
      - name: Resolve tag and build ref
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_SKIP_WINGET: ${{ inputs.skip_winget }}
          INPUT_RUN_SCOPE: ${{ inputs.run_scope }}
          INPUT_INVOKED_VIA_CALL: ${{ inputs.invoked_via_call }}
          INPUT_RELEASE_BODY: ${{ inputs.release_body }}
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          release_body=""
          # Reusable workflows inherit the caller's github.event_name (e.g. push), not
          # workflow_call. Use an explicit caller flag instead of github.event_name.
          if [ "${INPUT_INVOKED_VIA_CALL}" = "true" ]; then
            tag="${INPUT_RELEASE_TAG}"
            if [ -z "${tag}" ]; then
              echo "workflow_call requires release_tag input." >&2
              exit 1
            fi
            source_ref="${INPUT_SOURCE_REF}"
            if [ -z "${source_ref}" ]; then
              source_ref="${tag}"
            fi
            prerelease="${INPUT_PRERELEASE}"
            skip_winget="${INPUT_SKIP_WINGET}"
            run_scope="${INPUT_RUN_SCOPE:-full}"
            release_body="${INPUT_RELEASE_BODY}"
          elif [ "${event}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.release_tag }}"
            source_ref="${tag}"
            if echo "${tag}" | grep -q -- '-nightly'; then
              prerelease=true
              skip_winget=true
            else
              prerelease=false
              skip_winget=false
            fi
            run_scope="${{ github.event.inputs.run_scope }}"
          elif [ "${event}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            source_ref="${GITHUB_REF}"
            if echo "${tag}" | grep -q -- '-nightly'; then
              prerelease=true
              skip_winget=true
            else
              prerelease=false
              skip_winget=false
            fi
            run_scope=full
          else
            echo "Unsupported release trigger: event=${event}, ref=${GITHUB_REF}" >&2
            exit 1
          fi

          if [[ ! "${tag}" =~ ^v.+$ ]]; then
            echo "Tag must start with 'v' (got: ${tag})." >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "source_ref=${source_ref}"
            echo "prerelease=${prerelease}"
            echo "skip_winget=${skip_winget}"
            echo "run_scope=${run_scope}"
          } >> "${GITHUB_OUTPUT}"

          if [ -n "${release_body}" ]; then
            {
              echo "release_body<<EOF"
              printf '%s\n' "${release_body}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build teshi CLI
        run: cargo build --release --target ${{ matrix.target }} --bin teshi

      # Windows-only: build teshi-desktop + combined MSI installer
      - name: Install nightly WASM target
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Cache wasm-bindgen CLI
        id: cache_wasm_bindgen
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen.exe
          key: ${{ runner.os }}-wasm-bindgen-0.2.126

      - name: Install wasm-bindgen CLI
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.cache_wasm_bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --locked --version 0.2.126

      - name: Build GPUI WASM web UI
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./scripts/build-teshi-web.ps1

      - name: Install WiX Toolset
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Cache cargo-wix
        id: cache_cargo_wix
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: ${{ runner.os }}-cargo-wix-0.3.9

      - name: Install cargo-wix
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.cache_cargo_wix.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --locked --version 0.3.9

      - name: Build combined MSI installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with 'v' (got: $tag)." }

          $stagingRoot = "staging/msi-root"
          $binDir    = Join-Path $stagingRoot "bin"
          $shareDir  = Join-Path $stagingRoot "share"
          $webDir    = Join-Path $stagingRoot "share/web"
          $bridgeDir = Join-Path $stagingRoot "share/teshi-bridge"
          $agentDir  = Join-Path $stagingRoot "share/teshi-browser-testing"
          $agentBridgeDir = Join-Path $agentDir "extension/teshi-bridge"
          New-Item -ItemType Directory -Force -Path $binDir, $webDir, $bridgeDir, $agentBridgeDir | Out-Null

          # Verify required files
          $builtExe    = "target/${{ matrix.target }}/release/teshi.exe"
          @($builtExe, "apps/teshi-web/dist", "apps/teshi-web/dist/pkg/teshi_web_bg.wasm", "resources/browser_service.py",
            "resources/browser_agent_broker.py", "resources/winapp_service.py",
            "extension/teshi-bridge/manifest.json",
            "agent-packages/teshi-browser-testing/.codex-plugin/plugin.json") |
            ForEach-Object { if (-not (Test-Path $_)) { throw "Missing: $_" } }

          Copy-Item $builtExe   (Join-Path $binDir "teshi.exe")          -Force
          Copy-Item "resources/browser_service.py" (Join-Path $shareDir "browser_service.py") -Force
          Copy-Item "resources/browser_agent_broker.py" (Join-Path $shareDir "browser_agent_broker.py") -Force
          Copy-Item "resources/winapp_service.py"  (Join-Path $shareDir "winapp_service.py") -Force
          Copy-Item -Path "apps/teshi-web/dist/*" -Destination $webDir -Recurse -Force
          Copy-Item -Path "extension/teshi-bridge/*" -Destination $bridgeDir -Recurse -Force
          Copy-Item -Path "agent-packages/teshi-browser-testing/*" -Destination $agentDir -Recurse -Force
          Copy-Item -Path "agent-packages/teshi-browser-testing/.codex-plugin" -Destination $agentDir -Recurse -Force
          Copy-Item -Path "agent-packages/teshi-browser-testing/.mcp.json" -Destination $agentDir -Force
          Copy-Item -Path "extension/teshi-bridge/*" -Destination $agentBridgeDir -Recurse -Force

          # Generate WiX fragments for web, bridge, and browser-agent files
          $heat = Join-Path $env:WIX "bin/heat.exe"
          & $heat dir $webDir    -out wix/web-files.wxs    -gg -sfrag -srd -dr ShareWebDir    -cg WebFiles    -var var.WebRoot
          & $heat dir $bridgeDir -out wix/bridge-files.wxs -gg -sfrag -srd -dr ShareTeshiBridgeDir -cg BridgeFiles -var var.BridgeRoot
          & $heat dir $agentDir  -out wix/browser-agent-files.wxs -gg -sfrag -srd -dr ShareTeshiAgentDir -cg BrowserAgentFiles -var var.AgentRoot

          # Add fallback defines to heat-generated files (avoid here-string to prevent YAML backtick issues)
          $webDirFull = (Resolve-Path $webDir).Path
          $bridgeDirFull = (Resolve-Path $bridgeDir).Path
          $agentDirFull = (Resolve-Path $agentDir).Path
          $defaultBlock = "`n" +
            '<?ifndef WebRoot ?><?define WebRoot = "' + $webDirFull + '"?><?endif ?>' + "`n" +
            '<?ifndef BridgeRoot ?><?define BridgeRoot = "' + $bridgeDirFull + '"?><?endif ?>' + "`n" +
            '<?ifndef AgentRoot ?><?define AgentRoot = "' + $agentDirFull + '"?><?endif ?>' + "`n"
          foreach ($f in @("wix/web-files.wxs", "wix/bridge-files.wxs", "wix/browser-agent-files.wxs")) {
            $content = Get-Content $f -Raw
            $idx = $content.IndexOf("`n")
            if ($idx -ge 0) {
              Set-Content $f -Value ($content.Substring(0, $idx) + $defaultBlock + $content.Substring($idx)) -NoNewline
            }
          }

          cargo wix --package teshi-cli `
            --include wix/main.wxs `
            --include wix/web-files.wxs `
            --include wix/bridge-files.wxs `
            --include wix/browser-agent-files.wxs `
            --nocapture --no-build -o "target/wix/teshi-$tag-x64.msi"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: teshi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/teshi
            target/${{ matrix.target }}/release/teshi.exe
          if-no-files-found: error

      - name: Upload MSI artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: teshi-msi
          path: target/wix/teshi-*-x64.msi
          if-no-files-found: error

      - name: Upload web dist artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: teshi-web-dist
          path: apps/teshi-web/dist
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build, resolve]
    if: ${{ needs.resolve.outputs.run_scope != 'windows-only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Smoke-test browser-agent package
        run: python3 scripts/test-browser-agent-package.py

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"
          mkdir -p dist

          artifacts_dir="${{ github.workspace }}/artifacts"
          repo_dir="${{ github.workspace }}"

          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            binary_name="teshi"
            [[ "${target}" == *"windows"* ]] && binary_name="teshi.exe"

            stage_dir="dist/teshi-${version}-${target}"
            mkdir -p "${stage_dir}/share/teshi-bridge"
            mkdir -p "${stage_dir}/share/teshi-browser-testing/extension/teshi-bridge"
            cp "${artifacts_dir}/teshi-${target}/${binary_name}" "${stage_dir}/"

            cp "${repo_dir}/resources/browser_service.py" "${stage_dir}/share/browser_service.py"
            cp "${repo_dir}/resources/browser_agent_broker.py" "${stage_dir}/share/browser_agent_broker.py"
            cp -a "${repo_dir}/extension/teshi-bridge/." "${stage_dir}/share/teshi-bridge/"
            cp -a "${repo_dir}/agent-packages/teshi-browser-testing/." "${stage_dir}/share/teshi-browser-testing/"
            cp -a "${repo_dir}/extension/teshi-bridge/." "${stage_dir}/share/teshi-browser-testing/extension/teshi-bridge/"

            if [[ "${target}" == *"windows"* ]]; then
              mkdir -p "${stage_dir}/share/web"
              cp "${repo_dir}/resources/winapp_service.py"  "${stage_dir}/share/winapp_service.py"
              cp -a "${artifacts_dir}/teshi-web-dist/."      "${stage_dir}/share/web/"
            else
              chmod +x "${stage_dir}/teshi"
            fi

            if [[ "${target}" == *"windows"* ]]; then
              (cd dist && zip -r "teshi-${version}-${target}.zip" "teshi-${version}-${target}")
            else
              tar -C dist -czf "dist/teshi-${version}-${target}.tar.gz" "teshi-${version}-${target}"
            fi
          done

          (cd "${repo_dir}/extension/teshi-bridge" && zip -r "${repo_dir}/dist/teshi-bridge-${version}.zip" .)

          agent_stage="dist/teshi-browser-testing-${version}"
          mkdir -p "${agent_stage}/extension/teshi-bridge" "${agent_stage}/runtime"
          cp -a "${repo_dir}/agent-packages/teshi-browser-testing/." "${agent_stage}/"
          cp -a "${repo_dir}/extension/teshi-bridge/." "${agent_stage}/extension/teshi-bridge/"
          cp "${repo_dir}/resources/browser_service.py" "${agent_stage}/runtime/browser_service.py"
          cp "${repo_dir}/resources/browser_agent_broker.py" "${agent_stage}/runtime/browser_agent_broker.py"
          (cd dist && zip -r "teshi-browser-testing-${version}.zip" "teshi-browser-testing-${version}")

          cp "${artifacts_dir}/teshi-msi/"*.msi dist/
          cd dist
          find . -maxdepth 1 \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.msi" \) \
            -exec sha256sum {} + | sed 's|\./||' > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.source_ref }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ needs.resolve.outputs.prerelease != 'true' }}
          body: ${{ needs.resolve.outputs.release_body }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/SHA256SUMS

  submit_winget:
    name: Submit WinGet manifest
    runs-on: windows-latest
    needs: [publish, resolve]
    if: ${{ needs.resolve.outputs.run_scope != 'windows-only' && needs.resolve.outputs.skip_winget != 'true' }}

    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: winget install --id Microsoft.WingetCreate -e --source winget --accept-package-agreements --accept-source-agreements

      - name: Submit MSI to winget-pkgs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Host "Skipping WinGet submission: WINGET_TOKEN not configured."
            exit 0
          }

          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          $msiUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/teshi-$tag-x64.msi"
          $prTitle = "Add teshi $version"
          $pkgId = "teshi-org.teshi"
          $manifestDir = ".\winget-manifests\manifests\t\teshi-org\teshi\$version"

          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          $msiPath = Join-Path $manifestDir "teshi-$tag-x64.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
          $sha256 = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash
          Remove-Item -Path $msiPath -Force

          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ | Set-Content -NoNewline (Join-Path $manifestDir "$pkgId.yaml")

          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          Installers:
            - Architecture: x64
              InstallerType: wix
              InstallerUrl: $msiUrl
              InstallerSha256: $sha256
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ | Set-Content -NoNewline (Join-Path $manifestDir "$pkgId.installer.yaml")

          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: teshi-org
          PackageName: teshi
          License: MIT
          ShortDescription: Terminal-first mindmap editor for structured notes and navigation.
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ | Set-Content -NoNewline (Join-Path $manifestDir "$pkgId.locale.en-US.yaml")

          wingetcreate submit --prtitle $prTitle --token $env:WINGET_TOKEN --no-open $manifestDir
