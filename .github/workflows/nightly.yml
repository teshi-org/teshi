name: Nightly

on:
  schedule:
    # Daily catch-up from dev (06:00 UTC). Skips when HEAD already has a nightly tag.
    # Note: scheduled workflows run from the repo default branch workflow file.
    # Keep nightly.yml on default branch (main) for the schedule trigger to fire.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dev
  # A queued/manual invocation must not cancel a run that may already be
  # uploading the immutable release draft.
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    name: Prepare nightly tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      release_body: ${{ steps.meta.outputs.release_body }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute nightly tag
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin --tags --force

          version=$(grep -A20 '^\[workspace.package\]' Cargo.toml \
            | grep -m1 '^version = ' \
            | sed -E 's/^version = "([^"]+)".*/\1/')
          if [[ -z "${version}" ]]; then
            echo "workspace package version is missing from Cargo.toml" >&2
            exit 1
          fi
          date=$(date -u +%Y%m%d)
          sha=$(git rev-parse --short=7 HEAD)
          full_sha=$(git rev-parse HEAD)
          subject=$(git log -1 --format=%s)
          tag="v${version}-nightly.${date}.${sha}"

          # Nightly is a consumer of CI, not a second CI pipeline. Query the
          # exact dev HEAD so a newer/unrelated successful run cannot unlock a
          # different checkout. Missing, pending, failed, and API-error cases
          # all fail closed by setting skip=true.
          ci_runs_file="${RUNNER_TEMP}/ci-runs.json"
          if ! gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=dev&head_sha=${full_sha}&per_page=100" \
            > "${ci_runs_file}"; then
            echo "Unable to query CI status for ${full_sha}; skipping Nightly (fail closed)."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! ci_state=$(python - "${ci_runs_file}" "${full_sha}" <<'PY'
          import json
          import sys

          runs = json.load(open(sys.argv[1], encoding="utf-8")).get("workflow_runs", [])
          sha = sys.argv[2]
          matching = [run for run in runs if run.get("head_sha") == sha]
          successful = [run for run in matching if run.get("status") == "completed" and run.get("conclusion") == "success"]
          if successful:
              print("success")
          elif matching:
              statuses = sorted({f"{run.get('status')}/{run.get('conclusion')}" for run in matching})
              print("not-green:" + ",".join(statuses))
          else:
              print("missing")
          PY
          ); then
            echo "Unable to parse CI status for ${full_sha}; skipping Nightly (fail closed)."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${ci_state}" != "success" ]]; then
            echo "CI is not green for dev HEAD ${full_sha} (${ci_state}); skipping Nightly."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "CI passed for dev HEAD ${full_sha}; eligible for Nightly."

          if [[ ! "${tag}" =~ ^v[0-9].+-nightly\.[0-9]{8}\.[0-9a-f]{7}$ ]]; then
            echo "Computed nightly tag has unexpected format: ${tag}" >&2
            exit 1
          fi

          # Skip when this commit already has a nightly tag. The date in the tag
          # name is first-publish time, so a later cron must not mint a new tag
          # for unchanged HEAD.
          existing=$(git tag --list 'v*-nightly.*' --points-at "${full_sha}" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          if [ -n "${existing}" ]; then
            echo "Commit ${full_sha} already published as nightly (${existing}); skipping."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "release_tag=${tag}"
            echo "source_ref=${full_sha}"
            echo "release_body<<EOF"
            echo "Nightly pre-release built from \`dev\`."
            echo ""
            echo "Windows per-user installer only (\`teshi-*-x64-setup.exe\`). Linux/macOS archives and MSI are not published on this channel."
            echo ""
            echo "- Commit: ${full_sha}"
            echo "- Subject: ${subject}"
            echo "- Tag: ${tag}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Nightly tag: ${tag}"

  nightly:
    name: Build and publish nightly
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      release_body: ${{ needs.prepare.outputs.release_body }}
      prerelease: true
      skip_winget: true
      run_scope: windows-installer
      invoked_via_call: true
    secrets: inherit
