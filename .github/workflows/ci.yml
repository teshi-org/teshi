name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libglib2.0-dev libgtk-3-dev libgraphene-1.0-0 libpango1.0-dev libcairo2-dev libatk1.0-dev

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compilation check
        run: cargo check --workspace --exclude teshi-web --locked

      - name: Check Feature E2E ownership
        run: python scripts/check-feature-e2e-catalog.py

      - name: Check hosted UI WebSocket operation coverage
        run: python scripts/test-hosted-ui-transport.py

      - name: Check CI timeout and diagnostic infrastructure
        run: python -m unittest discover -s scripts/tests -p 'test_ci_*.py'

      - name: Validate Gherkin Features
        run: cargo run --locked -p teshi-cli -- check --all

      - name: Run validation CLI self-bootstrap E2E
        run: cargo test --locked -p teshi-cli --test validation_cli_bdd -- --nocapture

      - name: Run WinApp lossless capture and CLI contracts without a window
        run: |
          python -m pip install Pillow websockets playwright
          python -m unittest discover -s resources/tests -p 'test_winapp*.py'

      - name: Run deterministic browser broker contract tests
        run: |
          python -m unittest discover -s resources/tests -p 'test_browser_agent_broker.py'
          python -m unittest discover -s resources/tests -p 'test_browser_service_http.py'
          python -m unittest discover -s resources/tests -p 'test_browser_service_agent_flow.py'
          python -m unittest discover -s resources/tests -p 'test_browser_p2_privileged.py' -k setup_failure
          node --test extension/teshi-bridge/tests/protocol.test.mjs extension/teshi-bridge/tests/network-capture.test.mjs

      - name: Run tests
        run: cargo test --workspace --exclude teshi-web --locked

      - name: Verify package inventory contracts
        run: |
          python scripts/test_release_package.py
          python scripts/test_update_manifest.py
          python scripts/test-release-workflow-contract.py
          python scripts/test-nightly-workflow-contract.py
          python scripts/test-browser-agent-package.py

      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --exclude teshi-web --locked --all-targets --all-features -- -D warnings

      - name: Build doc
        run: cargo doc --workspace --exclude teshi-web --locked --no-deps --document-private-items

  tui-build:
    name: Prepare terminal tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restore and save Cargo artifacts once per platform
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/teshi-tui-runner -> target
      - name: Check terminal runner formatting
        run: cargo fmt --manifest-path crates/teshi-tui-runner/Cargo.toml --check
      - name: Check partition ownership
        run: python scripts/run-ci-suite.py check
      - name: Check CI infrastructure
        timeout-minutes: 3
        run: python -m unittest discover -s scripts/tests -p 'test_ci_*.py'
      - name: Compile once and inventory platform tests and Examples
        timeout-minutes: 25
        run: python scripts/run-ci-suite.py prepare --artifacts "${{ runner.temp }}/teshi-ci/build"
      - name: Run all non-ignored compiled tests and verify their execution
        timeout-minutes: 10
        run: python scripts/run-ci-command.py --label backend --timeout-seconds 540 --artifacts "${{ runner.temp }}/teshi-ci/backend/supervisor" -- python scripts/run-ci-suite.py backend --inventory "${{ runner.temp }}/teshi-ci/build/inventory.json" --artifacts "${{ runner.temp }}/teshi-ci/backend"
      - name: Lint terminal runner
        run: cargo clippy --manifest-path crates/teshi-tui-runner/Cargo.toml --locked --all-targets -- -D warnings
      - name: Pack required immutable executables and measure packaging cost
        run: python scripts/run-ci-suite.py pack --inventory "${{ runner.temp }}/teshi-ci/build/inventory.json" --artifacts "${{ runner.temp }}/teshi-ci/build" --archive "${{ runner.temp }}/terminal-binaries.tar.gz"
      - name: Upload compiled platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: terminal-binaries-${{ matrix.os }}
          path: ${{ runner.temp }}/terminal-binaries.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload platform inventory, backend execution and build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-build-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci
          if-no-files-found: error

  tui-shards:
    name: Terminal ${{ matrix.shard }} (${{ matrix.os }})
    needs: tui-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [directory, terminal-a, terminal-b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: terminal-build-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci
      - uses: actions/download-artifact@v4
        with:
          name: terminal-binaries-${{ matrix.os }}
          path: ${{ runner.temp }}
      - name: Restore and verify exact compiled artifacts
        run: python scripts/run-ci-suite.py unpack --inventory "${{ runner.temp }}/teshi-ci/build/inventory.json" --archive "${{ runner.temp }}/terminal-binaries.tar.gz" --artifacts "${{ runner.temp }}/teshi-ci/${{ matrix.shard }}"
      - name: Install Linux clipboard display
        if: runner.os == 'Linux' && matrix.shard != 'directory'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run isolated shard (Linux clipboard)
        if: runner.os == 'Linux' && matrix.shard != 'directory'
        timeout-minutes: 22
        run: python scripts/run-ci-command.py --label shard --timeout-seconds 1200 --artifacts "${{ runner.temp }}/teshi-ci/${{ matrix.shard }}/supervisor" -- xvfb-run -a python scripts/run-ci-suite.py ${{ matrix.shard }} --inventory "${{ runner.temp }}/teshi-ci/build/inventory.json" --artifacts "${{ runner.temp }}/teshi-ci/${{ matrix.shard }}"
      - name: Run isolated shard (Windows or directory)
        if: runner.os == 'Windows' || matrix.shard == 'directory'
        timeout-minutes: 22
        run: python scripts/run-ci-command.py --label shard --timeout-seconds 1200 --artifacts "${{ runner.temp }}/teshi-ci/${{ matrix.shard }}/supervisor" -- python scripts/run-ci-suite.py ${{ matrix.shard }} --inventory "${{ runner.temp }}/teshi-ci/build/inventory.json" --artifacts "${{ runner.temp }}/teshi-ci/${{ matrix.shard }}"
      - name: Upload shard execution, timings and all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.shard }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/teshi-ci/${{ matrix.shard }}
          if-no-files-found: error

  tui-tests:
    # Keep the existing required check name stable across the sharding change.
    name: Terminal interface tests (${{ matrix.os }})
    if: always()
    needs: [tui-build, tui-shards]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Require successful preparation and every shard
        shell: pwsh
        env:
          BUILD_RESULT: ${{ needs.tui-build.result }}
          SHARDS_RESULT: ${{ needs.tui-shards.result }}
        run: |
          if ($env:BUILD_RESULT -ne 'success' -or $env:SHARDS_RESULT -ne 'success') {
            throw 'Every platform preparation job and required shard must succeed'
          }
      - uses: actions/download-artifact@v4
        with:
          name: terminal-build-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci
      - uses: actions/download-artifact@v4
        with:
          name: terminal-directory-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci/directory
      - uses: actions/download-artifact@v4
        with:
          name: terminal-terminal-a-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci/terminal-a
      - uses: actions/download-artifact@v4
        with:
          name: terminal-terminal-b-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci/terminal-b
      - name: Verify compiled test coverage, Examples and actual capture files
        run: python scripts/run-ci-suite.py gate --inventory "${{ runner.temp }}/teshi-ci/build/inventory.json" --artifacts "${{ runner.temp }}/teshi-ci"
      - name: Upload the platform coverage gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-gate-${{ matrix.os }}
          path: ${{ runner.temp }}/teshi-ci/platform-gate.json
          if-no-files-found: error

  desktop:
    name: teshi-desktop build (GPUI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build teshi-desktop (GPUI)
        run: cargo build -p teshi-desktop --locked

  # Tauri-related CI suspended — frontend moving to GPUI
