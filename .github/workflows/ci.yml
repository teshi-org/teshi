name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libglib2.0-dev libgtk-3-dev libgraphene-1.0-0 libpango1.0-dev libcairo2-dev libatk1.0-dev

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compilation check
        run: cargo check --workspace --exclude teshi-web --locked

      - name: Check Feature E2E ownership
        run: python scripts/check-feature-e2e-catalog.py

      - name: Check hosted UI WebSocket operation coverage
        run: python scripts/test-hosted-ui-transport.py

      - name: Validate Gherkin Features
        run: cargo run --locked -p teshi-cli -- check --all

      - name: Run validation CLI self-bootstrap E2E
        run: cargo test --locked -p teshi-cli --test validation_cli_bdd -- --nocapture

      - name: Run WinApp lossless capture and CLI contracts without a window
        run: |
          python -m pip install Pillow websockets playwright
          python -m unittest discover -s resources/tests -p 'test_winapp*.py'

      - name: Run deterministic browser broker contract tests
        run: |
          python -m unittest discover -s resources/tests -p 'test_browser_agent_broker.py'
          python -m unittest discover -s resources/tests -p 'test_browser_service_http.py'
          python -m unittest discover -s resources/tests -p 'test_browser_service_agent_flow.py'
          python -m unittest discover -s resources/tests -p 'test_browser_p2_privileged.py' -k setup_failure
          node --test extension/teshi-bridge/tests/protocol.test.mjs extension/teshi-bridge/tests/network-capture.test.mjs

      - name: Run tests
        run: cargo test --workspace --exclude teshi-web --locked

      - name: Verify package inventory contracts
        run: |
          python scripts/test_release_package.py
          python scripts/test_update_manifest.py
          python scripts/test-release-workflow-contract.py
          python scripts/test-nightly-workflow-contract.py
          python scripts/test-browser-agent-package.py

      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --exclude teshi-web --locked --all-targets --all-features -- -D warnings

      - name: Build doc
        run: cargo doc --workspace --exclude teshi-web --locked --no-deps --document-private-items

  tui-tests:
    name: Terminal interface tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/teshi-tui-runner -> target
      - name: Check terminal runner formatting
        run: cargo fmt --manifest-path crates/teshi-tui-runner/Cargo.toml --check
      - name: Test real PTY backend and scenario protocol
        run: cargo test --manifest-path crates/teshi-tui-runner/Cargo.toml --locked
      - name: Lint terminal runner
        run: cargo clippy --manifest-path crates/teshi-tui-runner/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build Teshi CLI
        run: cargo build -p teshi-cli --locked
      - name: Run actual Teshi terminal regressions (Linux)
        if: runner.os != 'Windows'
        env:
          TESHI_SELF_TEST_BIN: ${{ github.workspace }}/target/debug/teshi
          TESHI_AI_POINTER_ARTIFACTS: ${{ runner.temp }}/ai-pointer-artifacts
        run: cargo test --manifest-path crates/teshi-tui-runner/Cargo.toml --locked -- --ignored
      - name: Run actual Teshi terminal regressions (Windows)
        if: runner.os == 'Windows'
        env:
          TESHI_SELF_TEST_BIN: ${{ github.workspace }}/target/debug/teshi.exe
          TESHI_AI_POINTER_ARTIFACTS: ${{ runner.temp }}/ai-pointer-artifacts
        run: |
          $env:TESHI_VT_INPUT_TEST_BIN = & ./scripts/prepare-windows-vt-test.ps1
          cargo test --manifest-path crates/teshi-tui-runner/Cargo.toml --locked -- --ignored

  desktop:
    name: teshi-desktop build (GPUI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build teshi-desktop (GPUI)
        run: cargo build -p teshi-desktop --locked

  # Tauri-related CI suspended — frontend moving to GPUI
