name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compilation check
        run: cargo check --workspace --exclude teshi-tauri --locked

      - name: Run tests
        run: cargo test --workspace --exclude teshi-tauri --locked

      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --exclude teshi-tauri --locked --all-targets --all-features -- -D warnings

      - name: Build doc
        run: cargo doc --workspace --exclude teshi-tauri --locked --no-deps --document-private-items

  desktop:
    name: teshi-desktop build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/teshi-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/teshi-tauri/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/teshi-tauri/frontend
        run: npm run build

      - name: Build teshi-tauri (no bundle)
        run: npx --prefix apps/teshi-tauri/frontend tauri build --config apps/teshi-tauri/tauri.conf.json --no-bundle

  web-ui-smoke:
    name: teshi web UI smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/teshi-tauri/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run web UI smoke
        run: bash scripts/run-web-ui-smoke.sh
