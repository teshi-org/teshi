<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="teshi GPUI WASM browser-session shell">
    <meta name="teshi-ui-runtime" content="gpui-wasm">
    <title>teshi — GPUI Web</title>
    <style>
      :root { color: #cdd6f4; background: #1e1e2e; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; }
      body > canvas { display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #1e1e2e;
        color: #a6adc8;
        padding: 2rem;
      }
      #loading[hidden] { display: none; }
      #loading.error {
        color: #f38ba8;
      }
      #loading.error .loading-progress { display: none; }
      #loading.error #loading-error { display: flex; }
      .loading-panel {
        width: min(22rem, 100%);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .loading-progress {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .loading-label {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .loading-bar-track {
        height: 0.35rem;
        border-radius: 999px;
        background: #313244;
        overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: #89b4fa;
        transition: width 0.12s ease-out;
      }
      .loading-bar-track.indeterminate .loading-bar-fill {
        width: 35%;
        transition: none;
        animation: loading-indeterminate 1.1s ease-in-out infinite;
      }
      @keyframes loading-indeterminate {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      .loading-detail {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        color: #6c7086;
        min-height: 1em;
      }
      #loading-error {
        display: none;
        flex-direction: column;
        gap: 0.65rem;
        text-align: left;
      }
      #loading-error-title {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f38ba8;
      }
      #loading-error-message {
        font-size: 0.9rem;
        line-height: 1.45;
        color: #cdd6f4;
        letter-spacing: normal;
        text-transform: none;
        word-break: break-word;
      }
      #loading-error-hint {
        font-size: 0.8rem;
        line-height: 1.45;
        color: #a6adc8;
        letter-spacing: normal;
        text-transform: none;
      }
      #loading-error-hint:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-panel">
        <div class="loading-progress">
          <div id="loading-label" class="loading-label">Downloading…</div>
          <div
            id="loading-bar-track"
            class="loading-bar-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-labelledby="loading-label"
          >
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
          </div>
          <div id="loading-detail" class="loading-detail">0%</div>
        </div>
        <div id="loading-error" role="alert">
          <div id="loading-error-title">Failed to start</div>
          <div id="loading-error-message"></div>
          <div id="loading-error-hint"></div>
        </div>
      </div>
    </div>
    <noscript>teshi requires JavaScript and WebAssembly.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
