[package]
name = "teshi-web"
version = "0.1.0"
edition = "2024"
description = "teshi GPUI WASM shell"
authors = ["teshi-org"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = { workspace = true }
console_error_panic_hook = "0.1"
futures-channel = "0.3"
wasm-bindgen-futures = "0.4"
gpui = { workspace = true }
gpui_platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
teshi-ui = { workspace = true }
teshi-core = { workspace = true }
teshi-web-protocol = { workspace = true }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "CloseEvent",
    "Document",
    "Element",
    "ErrorEvent",
    "Event",
    "HtmlElement",
    "History",
    "Location",
    "MessageEvent",
    "Response",
    "UrlSearchParams",
    "WebSocket",
    "Window",
    "console",
] }
